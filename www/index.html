<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d2419">
<title>凑十消除</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="hud">
    <div class="hud-top">
      <div class="score">
        <span class="score-label">当前得分</span>
        <span class="score-num" id="score">0</span>
      </div>
      <div class="best">最高 <b id="best">0</b></div>
    </div>
    <div class="bar">
      <div class="bar-fill" id="barFill"></div>
      <div class="bar-text" id="barText">0 / 160 格</div>
    </div>
  </header>

  <main class="stage">
    <div class="board" id="board">
      <div class="selbox" id="selbox"></div>
    </div>
  </main>

  <footer class="dock">
    <button class="btn" id="btnBomb">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="10.5" cy="14" r="5.5"/>
        <path d="M15 9.5l2-2"/>
        <path d="M19.5 4.5l1 1M20.5 8l1-1M17.5 3.5l.5 1.5"/>
      </svg>
      <span class="btn-label">炸弹 <b id="bombNum">3</b></span>
    </button>
    <button class="btn" id="btnNew">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 11.5a8.5 8.5 0 1 1-2.6-6"/>
        <path d="M20.5 4.5v6h-6"/>
      </svg>
      <span class="btn-label">换一盘</span>
    </button>
  </footer>

  <div class="tip" id="tip"></div>
</div>

<div class="sel-sum" id="selSum"></div>

<div class="mask" id="mask">
  <div class="dialog">
    <div class="d-title">这一盘消不动了</div>
    <div class="d-score" id="finalScore">0</div>
    <div class="d-sub">本局得分 · 最高 <b id="finalBest">0</b></div>
    <div class="d-row">
      <button class="d-btn ghost" id="btnClose">看看盘面</button>
      <button class="d-btn" id="btnAgain">再来一盘</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
<script>
  // PWA 离线缓存：只在 http(s) 下注册，Capacitor 的 capacitor:// 或 file:// 会跳过
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
